
[build]
  # This setting tells Netlify's secret scanner to ignore these specific
  # environment variables. These keys are public and are intended to be
  # included in the client-side bundle for Firebase to work.
  # For more information: https://docs.netlify.com/configure-builds/manage-dependencies/#secrets-scanning
  environment = { SECRETS_SCAN_OMIT_KEYS = [
    "NEXT_PUBLIC_FIREBASE_API_KEY",
    "NEXT_PUBLIC_FIREBASE_APP_ID",
    "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN",
    "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID",
    "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
    "NEXT_PUBLIC_FIREBASE_PROJECT_ID",
    "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET"
  ] }
